<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farsdagsgave til Tor-André</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: one portrait screen; gift box first, then a night scene by the fjord with the reveal card at the bottom */
:root{
  --night:#0b1626; --fjord:#12324a; --ice:#e9f1f4; --mist:#9fb4c2;
  --ember:#ffb25e; --aurora:#5fe0b0; --wood:#6b4630; --wood-d:#43291b;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ice);font-family:var(--body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.stage{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column}

/* ---------- Intro ---------- */
#intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding-block:24px}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,10vw,3rem);line-height:1.02;margin:0;text-wrap:balance}
h1 span{color:var(--ember)}
.gift{position:relative;width:170px;height:170px;border:0;background:none;padding:0;cursor:pointer;animation:wiggle 2.6s ease-in-out infinite}
.gift:focus-visible{outline:3px solid var(--aurora);outline-offset:10px;border-radius:12px}
.box{position:absolute;left:12px;right:12px;bottom:0;height:110px;background:linear-gradient(160deg,#1f7a64,#145846);border-radius:6px}
.lid{position:absolute;left:0;right:0;top:34px;height:34px;background:linear-gradient(160deg,#27917a,#1a6b56);border-radius:6px;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s}
.ribbon-v{position:absolute;left:50%;width:22px;margin-left:-11px;top:34px;bottom:0;background:var(--ember)}
.bow{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:80px;height:36px}
.bow::before,.bow::after{content:"";position:absolute;top:0;width:38px;height:30px;border:7px solid var(--ember);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.bow::before{left:0;transform:rotate(-18deg)}.bow::after{right:0;transform:rotate(18deg)}
.gift.open{animation:none}
.gift.open .lid,.gift.open .bow{transform:translateY(-140px) rotate(-25deg);opacity:0}
.gift.open .bow{transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s}
.cta{font-family:var(--display);font-weight:800;font-size:1.15rem;background:var(--ember);color:#2a1606;border:0;border-radius:999px;padding:16px 30px;cursor:pointer;box-shadow:0 8px 24px rgba(255,178,94,.25)}
.cta:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
.hint{color:var(--mist);font-size:.9rem;margin:0}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}

/* ---------- Scene ---------- */
#scene{flex:1;display:flex;flex-direction:column;min-height:0}
.view{flex:1;min-height:0;position:relative}
.view > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Skål-finale */
.toast{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at 50% 45%, rgba(11,22,38,.55), rgba(11,22,38,.15) 70%)}
.toast.on{opacity:1}
.glasses{width:min(92%,380px);height:auto;overflow:visible}
.gl{transform-box:view-box}
.gl.l{transform-origin:150px 300px;transform:translateX(-260px) rotate(-30deg)}
.gl.r{transform-origin:250px 300px;transform:translateX(260px) rotate(30deg)}
.toast.on .gl.l{animation:inL 1.5s cubic-bezier(.3,1.2,.4,1) forwards, clinkL 2.4s 1.5s ease-in-out infinite}
.toast.on .gl.r{animation:inR 1.5s cubic-bezier(.3,1.2,.4,1) forwards, clinkR 2.4s 1.5s ease-in-out infinite}
@keyframes inL{0%{transform:translateX(-260px) rotate(-30deg)}70%{transform:translateX(6px) rotate(14deg)}85%{transform:translateX(-4px) rotate(10deg)}100%{transform:translateX(0) rotate(12deg)}}
@keyframes inR{0%{transform:translateX(260px) rotate(30deg)}70%{transform:translateX(-6px) rotate(-14deg)}85%{transform:translateX(4px) rotate(-10deg)}100%{transform:translateX(0) rotate(-12deg)}}
@keyframes clinkL{0%,70%,100%{transform:translateX(0) rotate(12deg)}80%{transform:translateX(-14px) rotate(6deg)}90%{transform:translateX(3px) rotate(14deg)}}
@keyframes clinkR{0%,70%,100%{transform:translateX(0) rotate(-12deg)}80%{transform:translateX(14px) rotate(-6deg)}90%{transform:translateX(-3px) rotate(-14deg)}}
.spark{opacity:0;transform-box:fill-box;transform-origin:center}
.toast.on .spark{animation:spark .9s 1.05s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:scale(.2)}40%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.inbub{animation:inbub 2.2s linear infinite;transform-box:fill-box}
@keyframes inbub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-110px);opacity:0}}
.kos{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,9vw,2.6rem);line-height:1;margin:0;color:var(--ice);text-shadow:0 2px 18px rgba(255,178,94,.45);opacity:0;transform:scale(.8)}
.toast.on .kos{animation:pop .7s 1.3s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.bubbles{position:absolute;inset:0;overflow:hidden}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:1.5px solid rgba(246,211,107,.85);background:rgba(246,211,107,.18);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx,10px),-110vh);opacity:.2}}
.card{padding-block:14px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.card > *{opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s}
.card.show > *{opacity:1;transform:none}
.card.show > *:nth-child(2){transition-delay:.35s}.card.show > *:nth-child(3){transition-delay:.7s}
.card.show > *:nth-child(4){transition-delay:1.05s}.card.show > *:nth-child(5){transition-delay:1.5s}
.fizz circle{opacity:0}
.party .fizz circle{animation:fizz 4s ease-in infinite}
@keyframes fizz{0%{opacity:0;transform:translateY(0)}15%{opacity:.85}100%{opacity:0;transform:translateY(-300px)}}
.greet{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,7vw,2rem);line-height:1.05;margin:0;text-wrap:balance}
.greet span{color:var(--ember)}
.what{font-size:1.05rem;margin:0}
.what b{color:var(--aurora);font-weight:600}
.when{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px 0 0}
.chip{border:1.5px solid var(--ember);color:var(--ember);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.from{color:var(--mist);margin:6px 0 0;font-size:.95rem}
.from b{color:var(--ice);font-weight:600}
.again{background:none;border:0;color:var(--mist);text-decoration:underline;font:inherit;font-size:.85rem;cursor:pointer;margin-top:4px;justify-self:center}
.steam{animation:steam 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes steam{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.55}100%{opacity:0;transform:translate(14px,-60px) scale(1.8)}}
.aur{animation:aur 7s ease-in-out infinite alternate}
@keyframes aur{from{opacity:.35;transform:translateX(-8px)}to{opacity:.8;transform:translateX(8px)}}
.tw{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .gift,.steam,.aur,.tw,.party .fizz circle,.inbub,.bubbles i{animation:none}
  .toast.on .gl.l,.toast.on .gl.r{animation:none}
  .toast.on .gl.l{transform:rotate(12deg)}.toast.on .gl.r{transform:rotate(-12deg)}
  .toast.on .kos{animation:none;opacity:1;transform:none}
  .bubbles{display:none}
  .card > *{transition:none}
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
</style>
</head>
<body>

   <div class="view">

      </g>

      <path d="M-10 300 L120 300 Q140 305 135 312 L-10 312Z" fill="#e9f1f4" opacity=".85"/>
      <!-- badstue -->

      <path d="M8 252 L66 214 L124 252Z" fill="#2c1a10"/>
      <path d="M8 252 L66 214 L124 252 L118 252 L66 219 L14 252Z" fill="#e9f1f4" opacity=".9"/>
      <rect x="90" y="214" width="10" height="22" fill="#3a3a3a"/>
      <circle class="steam" cx="95" cy="208" r="6" fill="#d9e4ea"/>
      <circle class="steam" cx="95" cy="208" r="6" fill="#d9e4ea" style="animation-delay:1.1s"/>

      <!-- plask -->
      <g id="splash" opacity="0"></g>
      <!-- Tor-André -->
      <g id="man" transform="translate(150 300)">
        <g id="body" stroke="#f3d2b8" stroke-width="3.2" stroke-linecap="round" fill="none">
          <line id="legL" x1="0" y1="-14" x2="-4" y2="0"/><line id="legR" x1="0" y1="-14" x2="4" y2="0"/>
          <rect x="-4.5" y="-17" width="9" height="6" rx="1.5" fill="#d9483b" stroke="none"/>
          <line x1="0" y1="-14" x2="0" y2="-30"/>
          <line id="armL" x1="0" y1="-27" x2="-7" y2="-18"/><line id="armR" x1="0" y1="-27" x2="7" y2="-18"/>
          <circle cx="0" cy="-35" r="5" fill="#f3d2b8" stroke="none"/>
          <path d="M-5 -37 Q0 -44 5 -37Z" fill="#3a2a1c" stroke="none"/>
        </g>
      </g>
      <!-- bord med fingermat og bobler (vises på slutten) -->
      <g id="treats" opacity="0" style="transition:opacity 1s">
        <rect x="112" y="290" width="30" height="3" fill="#8a5d40"/>
        <line x1="115" y1="293" x2="115" y2="300" stroke="#8a5d40" stroke-width="2"/><line x1="139" y1="293" x2="139" y2="300" stroke="#8a5d40" stroke-width="2"/>
        <ellipse cx="122" cy="289" rx="7" ry="1.6" fill="#e9f1f4"/>
        <circle cx="119" cy="287.5" r="1.6" fill="#d9483b"/><circle cx="122.5" cy="287.2" r="1.6" fill="#f6d36b"/><circle cx="125.5" cy="287.6" r="1.6" fill="#5fe0b0"/>
        <path d="M131 280 L135 280 L134.3 286 L131.7 286Z" fill="#f6d36b"/><line x1="133" y1="286" x2="133" y2="290" stroke="#e9f1f4" stroke-width=".8"/>
        <path d="M136 280 L140 280 L139.3 286 L136.7 286Z" fill="#f6d36b"/><line x1="138" y1="286" x2="138" y2="290" stroke="#e9f1f4" stroke-width=".8"/>
        <rect x="128" y="276" width="2.6" height="14" rx="1" fill="#2f5a3a"/>
      </g>
      <g class="fizz" fill="#f6d36b">
        <circle cx="30" cy="470" r="3"/><circle cx="70" cy="470" r="2" style="animation-delay:.7s"/>
        <circle cx="110" cy="470" r="2.6" style="animation-delay:1.4s"/><circle cx="160" cy="470" r="1.8" style="animation-delay:.3s"/>
        <circle cx="205" cy="470" r="3.2" style="animation-delay:2.1s"/><circle cx="250" cy="470" r="2.2" style="animation-delay:1s"/>
        <circle cx="290" cy="470" r="2.8" style="animation-delay:2.6s"/><circle cx="335" cy="470" r="2" style="animation-delay:1.7s"/>
        <circle cx="185" cy="470" r="1.5" style="animation-delay:3.1s"/><circle cx="315" cy="470" r="1.6" style="animation-delay:.5s"/>
      </g>
      <text id="weee" x="0" y="0" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="16" fill="#ffb25e" opacity="0">Hopp!</text>
    </svg>
    <div class="toast" id="toast" aria-live="polite">
      <div class="bubbles" id="bubbles"></div>
      <svg class="glasses" viewBox="0 0 400 320" aria-hidden="true">
        <g class="gl l">
          <path d="M81 80 L143 80 L137 188 Q112 220 87 188 Z" fill="#f6d36b" opacity=".92"/>
          <circle class="inbub" cx="100" cy="185" r="2.4" fill="#fff6d8"/>
          <circle class="inbub" cx="114" cy="190" r="1.8" fill="#fff6d8" style="animation-delay:.7s"/>

          <circle class="inbub" cx="290" cy="190" r="2.4" fill="#fff6d8" style="animation-delay:1.1s"/>
          <circle class="inbub" cx="302" cy="183" r="1.8" fill="#fff6d8" style="animation-delay:1.8s"/>

          <line x1="263" y1="52" x2="269" y2="176" stroke="#ffffff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
          <rect x="285.5" y="214" width="5" height="86" fill="#e9f1f4"/>
          <ellipse cx="288" cy="300" rx="34" ry="7" fill="#e9f1f4"/>

          <line x1="220" y1="52" x2="240" y2="50"/><line x1="180" y1="52" x2="160" y2="50"/>
        </g>
      </svg>
      <p class="kos">Nå skal vi kose oss!</p>
    </div>
   </div>

    <div class="card" id="card">
      <p class="greet">Gratulerer med farsdagen, <span>Tor-André!</span></p>
      <p class="what">Du har fått <b>badstue på Yttervik Camping</b></p>
      <div class="when"><span class="chip">Lørdag 7. november</span><span class="chip" id="time">kl. 17.00–19.00</span></div>
      <p class="from">Hilsen <b>Tina og Anette med familier</b></p>
      <button class="again" id="again">Se igjen</button>
    </div>
  </section>
</div>

<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var intro=document.getElementById('intro'), scene=document.getElementById('scene'), gift=document.getElementById('gift');
  var man=document.getElementById('man'), body=document.getElementById('body');
  var legL=document.getElementById('legL'), legR=document.getElementById('legR');
  var armL=document.getElementById('armL'), armR=document.getElementById('armR');
  var splash=document.getElementById('splash'), weee=document.getElementById('weee'), card=document.getElementById('card');
  var NS='http://www.w3.org/2000/svg', actx=null, raf=0;
  var treats=document.getElementById('treats');
  var toast=document.getElementById('toast'), bubbles=document.getElementById('bubbles'), toastT=0, clinkT=0;
  for(var b=0;b<22;b++){
    var i=document.createElement('i'), s=6+Math.random()*16;
    i.style.width=i.style.height=s+'px'; i.style.left=(Math.random()*96)+'%';
    i.style.animationDuration=(4+Math.random()*4)+'s'; i.style.animationDelay=(-Math.random()*8)+'s';
    i.style.setProperty('--dx',(Math.random()*40-20)+'px'); bubbles.appendChild(i);
  }
  function clink(){
    if(!actx) return;
    try{
      [2093,3136,4186].forEach(function(fr,k){
        var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
        o.type='sine'; o.frequency.value=fr;
        g.gain.setValueAtTime(0.12/(k+1),t); g.gain.exponentialRampToValueAtTime(0.0005,t+1.2);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+1.25);
      });
    }catch(e){}
  }
  function party(on){
    scene.classList.toggle('party',on); treats.setAttribute('opacity',on?1:0);
    clearTimeout(toastT); clearTimeout(clinkT);
    if(!on){ toast.classList.remove('on'); return; }
    toastT=setTimeout(function(){
      toast.classList.add('on');
      if(!reduce) clinkT=setTimeout(clink,1050);
    }, reduce?0:1800);
  }

  function audio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){ actx=null; } }
  function plask(){
    if(!actx) return;
    try{
      var len=actx.sampleRate*0.9, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); }
      var src=actx.createBufferSource(); src.buffer=buf;
      var f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(2400,actx.currentTime); f.frequency.exponentialRampToValueAtTime(300,actx.currentTime+0.8);
      var g=actx.createGain(); g.gain.value=0.7;
      src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
    }catch(e){}
  }
  function tada(){
    if(!actx) return;
    try{
      [523.25,659.25,783.99,1046.5].forEach(function(fr,i){
        var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*0.12;
        o.type='triangle'; o.frequency.value=fr;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.65);
      });
    }catch(e){}
  }

  function setLimb(el,x2,y2){ el.setAttribute('x2',x2); el.setAttribute('y2',y2); }
  function pose(t){ // t walk phase
    var s=Math.sin(t);
    setLimb(legL,-5*s,0); setLimb(legR,5*s,0);
    setLimb(armL,-6*s,-18); setLimb(armR,6*s,-18);
  }
  function armsUp(){ setLimb(armL,-5,-42); setLimb(armR,5,-42); setLimb(legL,-2,0); setLimb(legR,2,0); }
  function crouch(){ setLimb(armL,-9,-22); setLimb(armR,9,-22); setLimb(legL,-6,-3); setLimb(legR,6,-3); }

  function makeSplash(x,y){
    splash.innerHTML='';
    for(var r=0;r<3;r++){
      var e=document.createElementNS(NS,'ellipse');
      e.setAttribute('cx',x); e.setAttribute('cy',y); e.setAttribute('rx',4); e.setAttribute('ry',1.5);
      e.setAttribute('fill','none'); e.setAttribute('stroke','#e9f1f4'); e.setAttribute('stroke-width','1.5');
      e.dataset.d=r*0.25; e.dataset.k='ring'; splash.appendChild(e);
    }
    for(var i=0;i<14;i++){
      var c=document.createElementNS(NS,'circle'), a=-Math.PI/2+(Math.random()-.5)*1.6, v=40+Math.random()*50;
      c.setAttribute('r',1.4+Math.random()*1.6); c.setAttribute('fill','#cfe6f2');
      c.dataset.vx=Math.cos(a)*v; c.dataset.vy=Math.sin(a)*v; c.dataset.k='drop'; splash.appendChild(c);
    }
    splash.dataset.x=x; splash.dataset.y=y;
  }
  function drawSplash(t){ // t seconds since splash
    var x=+splash.dataset.x, y=+splash.dataset.y;
    splash.setAttribute('opacity',1);
    Array.prototype.forEach.call(splash.children,function(el){
      if(el.dataset.k==='ring'){
        var tt=Math.max(0,t-el.dataset.d), r=4+tt*40;
        el.setAttribute('rx',r); el.setAttribute('ry',r*0.28); el.setAttribute('opacity',Math.max(0,1-tt/1.8));
      } else {
        var px=x+el.dataset.vx*t, py=y+el.dataset.vy*t+110*t*t;
        el.setAttribute('cx',px); el.setAttribute('cy',py); el.setAttribute('opacity',py>y+2?0:1);
      }
    });
  }

  function finalState(){
    man.setAttribute('opacity',0); weee.setAttribute('opacity',0);
    card.classList.add('show');
  }

  function play(){
    cancelAnimationFrame(raf);
    card.classList.remove('show'); party(false);
    splash.setAttribute('opacity',0); splash.innerHTML='';
    man.setAttribute('opacity',1); weee.setAttribute('opacity',0);
    if(reduce){ man.setAttribute('transform','translate(244 300)'); armsUp(); man.setAttribute('opacity',1); card.classList.add('show'); party(true); return; }
    var start=performance.now(), splashed=false, shown=false;
    var X0=150, X1=244, landX=300, waterY=330;
    function frame(now){
      var t=(now-start)/1000;
      if(t<1.8){ // gå ut brygga
        var p=t/1.8, x=X0+(X1-X0)*p;
        man.setAttribute('transform','translate('+x+' 300)'); pose(t*11);
      } else if(t<2.3){ // sats
        man.setAttribute('transform','translate('+X1+' 300)'); crouch();
      } else if(t<3.3){ // hopp
        var q=(t-2.3)/1.0, x2=X1+(landX-X1)*q, y2=300-70*Math.sin(Math.PI*q)+(waterY-300)*q*q;
        var rot=q<0.5?0:(q-0.5)*2*170;
        armsUp();
        man.setAttribute('transform','translate('+x2+' '+y2+') rotate('+rot+')');
        weee.setAttribute('x',x2-48); weee.setAttribute('y',y2-60);
        weee.setAttribute('opacity',q<0.75?1:Math.max(0,1-(q-0.75)*4));
      } else {
        if(!splashed){ splashed=true; man.setAttribute('opacity',0); weee.setAttribute('opacity',0); makeSplash(landX,waterY); plask(); }
        drawSplash(t-3.3);
        if(t>3.8 && !shown){ shown=true; card.classList.add('show'); party(true); tada(); }
        if(t>6) return;
      }
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }

  function open(){
    audio();
    gift.classList.add('open');
    setTimeout(function(){ intro.hidden=true; scene.hidden=false; play(); }, reduce?0:750);
  }
  gift.addEventListener('click',open);
  document.getElementById('openBtn').addEventListener('click',open);
  document.getElementById('again').addEventListener('click',function(){ audio(); play(); });
})();
</script>
</body>
